# ACT-pln.yaml
# Planificador de Fases
# Transforma issues en fases ejecutables

# RESTRICCIONES GLOBALES
restrictions:
  emoticons: prohibited_everywhere  # codigo, comentarios, commits, docs
  ai_references: prohibited_in_files  # IA, AI, asistente, Copilot, GPT, modelo

validate_against: STD-arch.yaml

severity_levels:
  - level: CRITICAL
    criteria: sistema inoperable o brecha seguridad
    priority: immediate

  - level: MAJOR
    criteria: degradacion funcional o violacion arquitectonica
    priority: high

  - level: MINOR
    criteria: deuda tecnica, estilo, UX
    priority: queue

  - level: TRIVIAL
    criteria: typos
    action: discard

numbering_system:
  purpose: insertar fases prioritarias sin renumerar existentes
  rules:
    - condition: nueva funcionalidad independiente
      format: "X.(Y+1)"
      example: "24.6 a 24.7"
    - condition: sub-fase o correccion
      format: "X.Y.(Z+1)"
      example: "24.6.1 a 24.6.1.1"
    - condition: prioridad intermedia
      action: insertar entre existentes
      example: "24.6.1.1 entre 24.6.1 y 24.6.2"

injection:
  requires: explicit_authorization
  order:
    - target: summary_table
      action: fila en posicion numerica
    - target: execution_diagram
      action: nodo con color y conexiones
    - target: next_action_table
      action: segun urgencia (priority_order)
    - target: detailed_specification
      action: bloque tras fase precedente

priority_order:
  - rank: 1
    criteria: bloquea a otras fases
    position: top
  - rank: 2
    criteria: dependencia directa de fase urgente
    position: after_blocker
  - rank: 3
    criteria: sin dependientes, igual urgencia
    position: numeric_order
  - rank: 4
    criteria: mejoras opcionales
    position: bottom

operations:
  add_phase:
    steps:
      - determinar numero segun numbering_system
      - validar contra STD-arch.yaml
      - verificar no afecta dependencias existentes
      - aplicar injection.order (4 actualizaciones)
      - ordenar en next_action segun priority_order

  complete_phase:
    steps:
      - estado: PENDIENTE a COMPLETADA (con fecha)
      - agregar commit hash
      - marcar checkboxes DoD
      - mover de next_action a completed_phases

phase_template:
  fields:
    - numero: required
    - titulo: required
    - objetivo: one_line
    - tipo: [BUG, FEATURE, REFACTOR]
    - severidad: [CRITICAL, MAJOR, MINOR]
    - rama: "fase-{numero}-{slug}"
    - estado: [PENDIENTE, COMPLETADA]
    - situacion:
        actual: required
        esperado: required
    - scope: files/modules
    - dod: checklist
    - dependencias: previous_phases

restriction: no modificar ROADMAP.md sin autorizacion explicita
