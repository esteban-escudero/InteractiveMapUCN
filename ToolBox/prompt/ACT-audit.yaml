# ACT-audit.yaml
# Auditoría arquitectónica automática
# Referencia: STD-arch.yaml

# RESTRICCIONES GLOBALES
restrictions:
  emoticons: prohibited_everywhere  # codigo, comentarios, commits, docs
  ai_references: prohibited_in_files  # IA, AI, asistente, Copilot, GPT, modelo

scans:
  - id: 1
    name: vertical
    description: Protección del núcleo
    find: 
      from: [domain/, application/]
      to: [infrastructure/, presentation/]
    severity: CRITICAL
    message: Núcleo depende de detalles. Aplique Inversión de Dependencias.

  - id: 2
    name: horizontal
    description: Segregación de adaptadores
    find:
      from: presentation/
      to: infrastructure/
    severity: CRITICAL
    message: Bypass de Application. Orqueste mediante UseCase.

  - id: 3
    name: skip
    description: Integridad de flujo
    find:
      from: presentation/
      action: manipula entidades sin application/
    severity: MAJOR
    message: Lógica de negocio en controlador. Mueva a UseCase.

  - id: 4
    name: cross_module
    description: Aislamiento de módulos
    find:
      from: moduleA/*
      to: [moduleB/domain/, moduleB/infrastructure/]
    except:
      - to: shared/ports/
      - from: "*.container.ts"
    severity: CRITICAL
    message: Acoplamiento cross-module. Extraiga a shared/ports/.

  - id: 5
    name: duplication
    description: DRY de interfaces
    find:
      pattern: same_interface
      in: [shared/ports/, module/domain/ports/]
    severity: MAJOR
    message: Interfaz duplicada. Mantenga fuente única.

  - id: 6
    name: container
    description: Composition Root correcto
    find:
      in: "*.container.ts"
      pattern: constructor imports concretes
    severity: MINOR
    message: DI incompleta. Concretos solo en factory.

exceptions:
  - pattern: "*.container.ts"
    to: "*"
    reason: Composition Root

  - pattern: "*"
    to: shared/ports/
    reason: Shared Kernel

  - pattern: "*"
    to: shared/infrastructure/
    reason: Adaptadores genéricos

  - pattern: "*.test.ts"
    to: "*"
    reason: Contexto de prueba

output:
  on_violation: block
  format: |
    | Archivo | Violación | Línea/Import | Solución |
