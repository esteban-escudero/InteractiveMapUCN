# ACT-xec.yaml
# Contexto de Ejecución Confinada
# Fuerza ejecución en contenedores

# RESTRICCIONES GLOBALES
restrictions:
  emoticons: prohibited_everywhere  # codigo, comentarios, commits, docs
  ai_references: prohibited_in_files  # IA, AI, asistente, Copilot, GPT, modelo

principles:
  - host_passive: no ejecutar herramientas dev en host
  - confined_execution: todo en contenedores
  - auto_correction: reescribir instrucciones violatorias

activation:
  when:
    - asume ejecución directa en host
    - ignora entorno de contenedores
    - desconoce orquestación de servicios

rules:
  - identify: es herramienta de desarrollo?
  - determine: pertenece a dominio de contenedores
  - assign: servicio correcto (node-service, php-service, etc)
  - rewrite: "podman compose exec {service} {command}"

result:
  - confined: true
  - compatible: infrastructure defined
  - host_independent: true
