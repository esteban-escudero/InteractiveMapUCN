# PRO-git.yaml
# Protocolo de Control de Versiones

# RESTRICCIONES DE CONTENIDO
restrictions:
  emoticons: prohibited_everywhere  # codigo, comentarios, commits, docs
  ai_references: prohibited_in_files  # IA, AI, asistente, Copilot, GPT, modelo

versioning:
  analyze: última fase en ROADMAP.md
  rules:
    - case: nueva funcionalidad independiente
      version: "X.(Y+1)"
    - case: sub-fase o derivada
      version: "X.Y.(Z+1)"

workflow:
  - before: cualquier modificación
    action: crear rama fase-{version}-{slug}
  
  - base: último estado estable (rama fase anterior)
  
  - isolation: toda modificación en la rama

deny:
  - action: commit directo a main/master/develop
    allowed: false

  - action: romper linealidad del historial
    allowed: false

  - action: modificar sin rama activa
    allowed: false
