# ACT-nxt.yaml
# Next Execution Target
# Inicia sesion de trabajo con siguiente fase pendiente

# RESTRICCIONES GLOBALES
restrictions:
  emoticons: prohibited_everywhere  # codigo, comentarios, commits, docs
  ai_references: prohibited_in_files  # IA, AI, asistente, Copilot, GPT, modelo

hierarchy:
  - level: 1
    file: daRulez.md
    role: constitucion (prevalece)
  - level: 2
    file: STD-arch.md
    role: arquitectura mandatoria
  - level: 3
    file: STD-infra.md
    role: reglas infraestructura
  - level: 4
    file: ROADMAP.md
    role: fases y estado

protocol:
  step_1_context:
    action: presentar al usuario antes de ejecutar
    show:
      - fase identificada (numero, titulo)
      - objetivo
      - dependencias (verificar COMPLETADAS)
      - acciones planificadas
    then: esperar confirmacion

  step_2_validation:
    - audit: ACT-audit.yaml
    - architecture: STD-arch.yaml
    - containers: STD-infra.yaml (verificar activos)

  step_3_execution:
    - follow: especificacion en ROADMAP.md
    - branching: PRO-git.md

  step_4_closure:
    - run_tests: podman exec {container} npm run test
    - update_roadmap: segun ACT-pln.md
    - commit: segun PRO-git.md

tools:
  - file: ACT-audit.md
    use: validar arquitectura
  - file: ACT-pln.md
    use: agregar/completar fases
  - file: ACT-trg.md
    use: discriminar tipo tarea
  - file: ACT-xec.md
    use: contexto ejecucion
  - file: PRO-git.md
    use: branching, commits

rules:
  - on_ambiguity: stop_and_ask
  - dependencies: must_be_COMPLETADA
  - confirmation: always_before_execute
